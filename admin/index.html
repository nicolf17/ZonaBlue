<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Zona Blue — panel de administracion." />
    <meta name="theme-color" content="#050508" />
    <title>Zona Blue | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Great+Vibes&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css?v=20261120" />
    <link rel="icon" href="/assets/logo-zb-mark.png" type="image/png" />
  </head>
  <body>
    <div class="admin-screen" id="adminRoot">
      <!-- Pantalla de login -->
      <section class="admin-auth" id="adminAuth">
        <p class="admin-kicker">ZONA BLUE · PANEL</p>
        <h1 class="admin-title">Admin</h1>
        <form id="adminLoginForm" class="admin-form">
          <label class="admin-field">
            <span>Usuario</span>
            <input id="adminUser" type="text" autocomplete="username" required />
          </label>
          <label class="admin-field">
            <span>Clave</span>
            <input id="adminPass" type="password" autocomplete="current-password" required />
          </label>
          <button class="btn admin-submit" type="submit">Entrar</button>
          <p class="admin-error" id="adminError" hidden>Usuario o clave invalidos.</p>
        </form>
      </section>

      <!-- Panel principal (oculto hasta login) -->
      <section class="admin-panel" id="adminPanel" hidden>
        <header class="admin-head">
          <h1 class="admin-title">Panel Zona Blue</h1>
          <button type="button" class="btn btn--ghost" id="adminLogout">Salir</button>
        </header>

        <div class="admin-stats" id="adminStats"></div>

        <!-- Lista de productos tipo grid automático -->
        <section class="admin-section" id="adminSection">
          <h2 class="admin-section-title">Productos</h2>
          <div class="admin-grid" id="adminList">
            <!-- Las cards se renderizan acá -->
          </div>
        </section>

        <!-- Modal para crear/editar producto (sobresale sobre el panel) -->
        <div id="productModal" class="modal" hidden>
          <div class="modal__backdrop" data-modal-close></div>
          <div class="modal__content">
            <button type="button" class="modal__close" data-modal-close aria-label="Cerrar">×</button>
            <h2 class="modal__title" id="modalTitle">Nuevo producto</h2>
            <form id="productForm" class="product-form">
              <input type="hidden" id="formId" />
              <div class="form-grid">
                <div class="form-group">
                  <label>Nombre</label>
                  <input id="formName" type="text" required />
                </div>
                <div class="form-group">
                  <label>Categoría</label>
                  <select id="formCategory" required>
                    <option value="">-- Selecciona categoría --</option>
                  </select>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Precio</label>
                    <input id="formPrice" type="text" inputmode="decimal" />
                  </div>
                  <div class="form-group">
                    <label>Precio anterior</label>
                    <input id="formOldPrice" type="text" inputmode="decimal" />
                  </div>
                </div>
                <div class="form-group">
                  <label>Tag</label>
                  <input id="formTag" type="text" placeholder="Promo, Importada, Nuevo..." />
                </div>
                <div class="form-group">
                  <label>Colores (separados por coma)</label>
                  <input id="formColors" type="text" />
                </div>
                <div class="form-group">
                  <label>Tallas (separadas por coma)</label>
                  <input id="formSizes" type="text" />
                </div>
              </div>
              <div class="form-group">
                <label>Descripción</label>
                <textarea id="formDesc" rows="3"></textarea>
              </div>
              <div class="form-group">
                <label>Detalles (separados por coma)</label>
                <textarea id="formDetails" rows="3"></textarea>
              </div>
              <div class="form-check">
                <label>
                  <input type="checkbox" id="formPromo" />
                  Producto en promoción
                </label>
              </div>
              <div class="form-group">
                <label>Imagen (URL o dejar vacío para placeholder)</label>
                <input id="formImage" type="text" placeholder="assets/products/canva/p6-1.jpg" />
              </div>
              <div class="form-group">
                <label>Posición de imagen</label>
                <input id="formImagePos" type="text" value="center 38%" readonly />
                <small>Se configura automáticamente; no modificar normalmente.</small>
              </div>
              <div class="form-actions">
                <button type="button" class="btn" id="formCancel">Cancelar</button>
                <button type="button" class="btn admin-submit" id="formSave">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </div>
    <script src="/js/products.js?v=20261120"></script>
    <script src="/js/admin.js?v=20261122"></script>
  </body>
</html>
